x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: globoatlas
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d globoatlas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # SeaweedFS — S3-compatible object storage. Replaced MinIO (Inc. closed-source from late 2025).
  # Apache 2.0, actively maintained. Backend uses the same minio npm SDK pointed at this endpoint.
  storage:
    image: chrislusf/seaweedfs:3.96
    restart: unless-stopped
    logging: *default-logging
    environment:
      S3_USER: ${MINIO_USER}
      S3_PASS: ${MINIO_PASSWORD}
    entrypoint:
      - sh
      - -c
      - 'mkdir -p /etc/seaweedfs && printf ''{"identities":[{"name":"%s","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'' "$$S3_USER" "$$S3_USER" "$$S3_PASS" > /etc/seaweedfs/s3config.json && exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3config.json -s3.port=8333 -master.volumeSizeLimitMB=1024 -ip.bind=0.0.0.0'
    volumes:
      - storagedata:/data
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/globoatlas
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # Object storage — SeaweedFS S3. Env names kept as MINIO_* so backend code stays unchanged.
      MINIO_ENDPOINT: storage
      MINIO_PORT: 8333
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      storage:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "0.0.0.0:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "0.0.0.0:8080:80"
      - "0.0.0.0:8443:443"
    depends_on:
      - web
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  storagedata:
