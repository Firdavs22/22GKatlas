events { worker_connections 128; }
http {
    server_tokens off;
    server {
        listen 80;
        server_name _;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / { return 404; }
    }
}
